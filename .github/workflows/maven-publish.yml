
name: Maven Package

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn -B clean package --file pom.xml

      - name: Artifact list
        run: ls -l target/*.jar

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: java-cicd-app
          path: target/*.jar

  
    
