name: Java Maven Build on Self Hosted Runner

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: my

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Java
        run: java -version

      - name: Check Maven
        run: mvn -version

      - name: Compile Java Code
        run: mvn compile

      - name: Run Test Cases
        run: mvn test

      - name: Build JAR
        run: mvn package

  
    
