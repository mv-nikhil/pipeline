
name: CI with AWS SES Email (OIDC)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::070203626493:role/GitHubActionsSesSenderRole
          aws-region: us-east-1

      - name: Run build (example)
        run: |
          echo "Simulating a build process..."
          # Uncomment to test failure notification
          # exit 1

      - name: Send Email Notification (on success)
        if: success()
        run: |
          aws ses send-email \
            --from 'kannan71nikhil@gmail.com' \
            --destination 'ToAddresses="kmv8711@gmail.com"' \
            --message 'Subject={Data="Build Success - ${{ github.repository }}"},Body={Text={Data="Build for ${{ github.repository }} on branch ${{ github.ref_name }} was successful! Commit: ${{ github.sha }} Workflow Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}}' \
            --region us-east-1

      - name: Send Email Notification (on failure)
        if: failure()
        run: |
          aws ses send-email \
            --from 'kannan71nikhil@gmail.com' \
            --destination 'ToAddresses="kmv8711@gmail.com"' \
            --message 'Subject={Data="Build FAILED - ${{ github.repository }}"},Body={Text={Data="Build for ${{ github.repository }} on branch ${{ github.ref_name }} FAILED! Commit: ${{ github.sha }} Workflow Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}}' \
            --region us-east-1
